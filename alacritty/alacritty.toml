[general]
import = [
    "~/.config/alacritty/themes/themes/carbonfox.toml",
    "~/.config/alacritty/font.toml",   # pointer set by switch-font.sh
]

[env]
TERM = "xterm-256color"

[window]
startup_mode = "Fullscreen"
decorations = "None"
opacity = 0.7
padding = { x = 16 , y = 16 }

[terminal.shell]
program = "/opt/homebrew/bin/bash"
args = ["-l"]
