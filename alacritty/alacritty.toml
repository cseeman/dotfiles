[general]
# Both imports are pointer files: theme.toml is set by tmux/switch-theme.sh,
# font.toml by switch-font.sh.
import = [
    "~/.config/alacritty/theme.toml",
    "~/.config/alacritty/font.toml",
]

[env]
TERM = "xterm-256color"

[window]
startup_mode = "Fullscreen"
decorations = "None"
opacity = 0.7
padding = { x = 16 , y = 16 }

[terminal.shell]
program = "/opt/homebrew/bin/bash"
args = ["-l"]
