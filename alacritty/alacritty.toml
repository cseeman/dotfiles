[general]
import = [
    "~/.config/alacritty/themes/themes/carbonfox.toml"
]

[env]
TERM = "xterm-256color"

[window]
startup_mode = "Fullscreen"
decorations = "None"
opacity = 0.7
padding = { x = 16 , y = 16 }

[font]
# Maple Mono NF has genuine cursive italics built in --
# no family-mixing needed, unlike the Monaspace setup.
normal = { family = "Maple Mono NF", style = "Regular" }
bold = { family = "Maple Mono NF", style = "Bold" }
italic = { family = "Maple Mono NF", style = "Italic" }
bold_italic = { family = "Maple Mono NF", style = "Bold Italic" }

size = 14

[font.offset]
x = 0
y = 1

[terminal.shell]
program = "/opt/homebrew/bin/bash"
args = ["-l"]
