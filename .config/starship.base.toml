"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_start)\
$os\
$username\
[](bg:color_dir fg:color_start)\
$directory\
[](fg:color_dir bg:color_git)\
$git_branch\
$git_status\
[](fg:color_git bg:color_lang)\
$ruby\
$nodejs\
$python\
[](fg:color_lang bg:color_ui1)\
$docker_context\
$jobs\
$cmd_duration\
[](fg:color_ui1 bg:color_ui2)\
$time\
[ ](fg:color_ui2)\
$line_break$character"""

palette = 'equinox-dawn'

[os]
disabled = false
style = "bg:color_start fg:color_text"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:color_start fg:color_text"
style_root = "bg:color_start fg:color_text"
format = '[ $user ]($style)'

[directory]
style = "fg:color_text bg:color_dir"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_git"
format = '[[ $symbol $branch ](fg:color_text bg:color_git)]($style)'

[git_status]
style = "bg:color_git"
format = '[[($all_status$ahead_behind )](fg:color_text bg:color_git)]($style)'

[ruby]
symbol = ""
style = "bg:color_lang"
format = '[[ $symbol( $version) ](fg:color_text bg:color_lang)]($style)'

[nodejs]
symbol = ""
style = "bg:color_lang"
format = '[[ $symbol( $version) ](fg:color_text bg:color_lang)]($style)'

[python]
symbol = ""
style = "bg:color_lang"
format = '[[ $symbol( $version) ](fg:color_text bg:color_lang)]($style)'

[docker_context]
symbol = ""
style = "bg:color_ui1"
format = '[[ $symbol( $context) ](fg:color_text_end bg:color_ui1)]($style)'

[jobs]
symbol = ""
style = "bg:color_ui1"
format = '[[ $symbol $number ](fg:color_text_end bg:color_ui1)]($style)'

[cmd_duration]
min_time = 2000
style = "bg:color_ui1"
format = '[[  $duration ](fg:color_text_end bg:color_ui1)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_ui2"
format = '[[  $time ](fg:color_text_end bg:color_ui2)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[](bold fg:color_green)'
error_symbol = '[](bold fg:color_red)'
vimcmd_symbol = '[](bold fg:color_green)'
vimcmd_replace_one_symbol = '[](bold fg:color_purple)'
vimcmd_replace_symbol = '[](bold fg:color_purple)'
vimcmd_visual_symbol = '[](bold fg:color_yellow)'
