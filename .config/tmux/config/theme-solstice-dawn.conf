###############################################################################
# Solstice Dawn - Light Summer Theme
# Sunrise on the beach: warm sandy backgrounds with vivid summer accents
###############################################################################

# Base colors - warm beach sand
bg_light="#fdf6e8"         # Brightest sand (near white)
bg="#f5edda"               # Base warm sand
bg_mid="#ede3cc"           # Sand shadow
surface0="#ddd4b8"         # Deeper sand
surface1="#cac0a2"         # Muted sand
surface2="#b5aa8c"         # Darkest sand

# Text colors - deep ocean for contrast on light backgrounds
text="#1e3040"             # Deep ocean dark
subtext1="#2d4559"         # Dark ocean
subtext0="#3d5a70"         # Medium dark
overlay="#6b8496"          # Muted overlay

# Summer accent palette - deepened for light-background contrast
# (all work as highlight backgrounds with near-white text on top)
coral="#cc2f2f"            # Deep coral
mango="#c06a00"            # Rich mango orange
sunshine="#9e7200"         # Amber gold (darkened for text readability)
lime="#4a8b0d"             # Rich tropical lime
seafoam="#0f9060"          # Deep seafoam green
lagoon="#0090a0"           # Deep lagoon turquoise
ocean="#1675b8"            # Rich ocean blue
flamingo="#c43070"         # Deep flamingo pink
violet="#7040b0"           # Tropical violet

# Mode indicator configuration
set -g @mode_indicator_prefix_prompt " WAIT "
set -g @mode_indicator_prefix_mode_style "bg=$mango,fg=$bg_light,bold"
set -g @mode_indicator_copy_prompt " COPY "
set -g @mode_indicator_copy_mode_style "bg=$ocean,fg=$bg_light,bold"
set -g @mode_indicator_sync_prompt " SYNC "
set -g @mode_indicator_sync_mode_style "bg=$coral,fg=$bg_light,bold"
set -g @mode_indicator_empty_prompt " TMUX "
set -g @mode_indicator_empty_mode_style "bg=$surface0,fg=$violet,bold"

# Online status icons
set -g @route_to_ping "1.1.1.1"
set -g @online_icon "#[fg=$seafoam]󰖩 "
set -g @offline_icon "#[fg=$coral]󰖪 "

# Status bar
set -g status on
set -g status-justify left
set -g status-position bottom
set -g status-left-length 120
set -g status-right-length 120
set -g status-style "bg=$bg_mid,fg=$text"

# Window styles - active pane is lightest, inactive panes visibly dimmed
set -g window-style "fg=$overlay,bg=$surface0"
set -g window-active-style "fg=$text,bg=$bg_light"

# Pane borders
set -g pane-border-style "fg=$surface1"
set -g pane-active-border-style "fg=$lagoon,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format " #[fg=$flamingo,bold]#{?pane_active,󰄯 ,󰄰 }#[fg=#{?pane_active,$text,$subtext1},bold]#P: #{pane_title} "

# Pane number display
set -g display-panes-colour "$overlay"
set -g display-panes-active-colour "$lagoon"
set -g display-panes-time 2000

# Message and command styling
set -g message-style "bg=$lagoon,fg=$bg_light,bold"
set -g message-command-style "bg=$surface1,fg=$ocean"

# Window status separator (invisible)
setw -g window-status-separator ""

#################################### STATUS BAR FORMAT ####################################

# Left side: Mode + Session name
set -g status-left "#{tmux_mode_indicator}#[bg=$surface0,fg=$seafoam,bold] 󰄛 #S #[bg=$bg_mid,fg=$surface0]"

# Right side: Online status + Time + Date
set -g status-right "#[fg=$surface0,bg=$bg_mid]#[fg=$subtext1,bg=$surface0]#{online_status}#[fg=$surface1,bg=$surface0]#[fg=$mango,bg=$surface1] 󰥔 %H:%M #[fg=$surface2,bg=$surface1]#[fg=$ocean,bg=$surface2]  %a %d %b #[fg=$bg_mid,bg=$surface2]"

# Window status formats
setw -g window-status-format "#[fg=$bg_mid,bg=$surface0]#[fg=$subtext1,bg=$surface0] #I  #W #[fg=$surface0,bg=$bg_mid]"
setw -g window-status-current-format "#[fg=$bg_mid,bg=$lagoon]#[fg=$bg_light,bg=$lagoon,bold] #I  #W #[fg=$lagoon,bg=$bg_mid]"

# Activity and bell notifications
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=$mango,bg=$surface0,bold"
setw -g window-status-bell-style "fg=$coral,bg=$surface0,bold,blink"

# Selection colors
set -g mode-style "bg=$surface1,fg=$text"

# Clock mode
set -g clock-mode-colour "$lagoon"
set -g clock-mode-style 24

# Copy mode highlighting
set -g copy-mode-match-style "bg=$sunshine,fg=$bg_light"
set -g copy-mode-current-match-style "bg=$mango,fg=$bg_light,bold"
set -g copy-mode-mark-style "bg=$flamingo,fg=$bg_light"

#################################### ENHANCED FEATURES ####################################

# Popup styling
set -g popup-style "bg=$bg,fg=$text"
set -g popup-border-style "fg=$lagoon"
set -g popup-border-lines "rounded"

# Menu styling
set -g menu-style "bg=$surface0,fg=$text"
set -g menu-selected-style "bg=$lagoon,fg=$bg_light"
set -g menu-border-style "fg=$lagoon"
