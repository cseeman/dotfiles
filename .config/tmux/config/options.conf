###############################################################################
# Behaviour
###############################################################################

set -g default-shell "$SHELL"

# tmux-256color (not screen-256color) is what tmux upstream recommends: it
# advertises italics and the full 256-color set.
set -g default-terminal "tmux-256color"

# Copying goes through pbcopy in keybindings.conf, not OSC 52.
set -s set-clipboard off

set -g mouse on
setw -g mode-keys vi
setw -g xterm-keys on

# faster command sequences
set -s escape-time 10

# increase repeat timeout
set -g repeat-time 600
set -s focus-events on

set -g history-limit 10000

# number windows and panes from 1, and close gaps when a window closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g automatic-rename on
set -g set-titles on

set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10

# Flag activity in the window list, but never with a bell or a flash.
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none

# Declare truecolor for the terminals actually in use. The previous value here
# named terminal "XXX", which matches nothing and so declared nothing; RGB was
# working only via Ghostty's COLORTERM autodetection.
#
# terminal-features is a server option that APPENDS. Every theme switch sources
# this file, so an unguarded -as grows the list on each reload; the marker keeps
# it to one pass per server.
%if "#{!=:#{@rgb_declared},1}"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g @rgb_declared 1
%endif

###############################################################################
# Reserrect
###############################################################################

set -g @resurrect-dir "$tmux_dir/resurrect"
set -g @resurrect-save "S"                          # Save the session
set -g @resurrect-restore "R"                       # Reload the session
set -g @continuum-restore "on"                      # Last saved session is always restored
set -g @resurrect-strategy-nvim "session"           # Restore Neovim session if a Session.vim file is present

###############################################################################
# Command aliases
###############################################################################
# These lived in every theme file, so switching themes could quietly redefine
# them. They are not theme settings; they belong here, defined once.

set -g command-alias[0] p='display-popup -E -w 80% -h 80%'
set -g command-alias[1] h='split-window -h'
set -g command-alias[2] v='split-window -v'
set -g command-alias[3] reload='source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"'
