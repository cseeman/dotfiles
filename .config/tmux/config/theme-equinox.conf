###############################################################################
# Equinox - Dark Autumn Theme
# Woodsmoke and late harvest: deep bark browns with warm foliage accents
###############################################################################

# Base colors - woodsmoke and bark
bg_darkest="#120e0a"       # Charred wood
bg_dark="#1b1611"          # Deep bark
bg="#231c15"               # Base
surface0="#2e251b"         # Surface
surface1="#3b3024"         # Surface highlight
surface2="#4a3c2d"         # Surface bright

# Text colors - parchment and dry grass
text="#f4e6d2"             # Warm parchment
subtext1="#dcc9ab"         # Aged paper
subtext0="#b9a68a"         # Dry grass
overlay="#8d7c65"          # Bark overlay

# Autumn accent palette
maple="#f4806c"            # Red maple
rust="#ff9257"             # Burnt orange (primary)
amber="#f8c96f"            # Amber gold
wheat="#e3d29a"            # Dried wheat
moss="#b3c674"             # Moss and olive
pine="#7cc296"             # Evergreen
dusk="#8fbde0"             # October sky
berry="#e895b4"            # Cranberry
plum="#c5a2e2"             # Aster plum

# Mode indicator configuration
set -g @mode_indicator_prefix_prompt " WAIT "
set -g @mode_indicator_prefix_mode_style "bg=$rust,fg=$bg_darkest,bold"
set -g @mode_indicator_copy_prompt " COPY "
set -g @mode_indicator_copy_mode_style "bg=$dusk,fg=$bg_darkest,bold"
set -g @mode_indicator_sync_prompt " SYNC "
set -g @mode_indicator_sync_mode_style "bg=$maple,fg=$bg_darkest,bold"
set -g @mode_indicator_empty_prompt " TMUX "
set -g @mode_indicator_empty_mode_style "bg=$surface0,fg=$pine,bold"

# Online status icons
set -g @route_to_ping "1.1.1.1"
set -g @online_icon "#[fg=$pine]󰖩 "
set -g @offline_icon "#[fg=$maple]󰖪 "

# Status bar
set -g status on
set -g status-justify left
set -g status-position bottom
set -g status-left-length 120
set -g status-right-length 120
set -g status-style "bg=$bg_dark,fg=$text"

# Window styles
set -g window-style "fg=$subtext0,bg=$bg_dark"
set -g window-active-style "fg=$text,bg=$bg"

# Pane borders
set -g pane-border-style "fg=$surface1"
set -g pane-active-border-style "fg=$rust,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format " #[fg=$berry,bold]#{?pane_active,󰄯 ,󰄰 }#[fg=#{?pane_active,$text,$subtext1},bold]#P: #{pane_title} "

# Pane number display
set -g display-panes-colour "$overlay"
set -g display-panes-active-colour "$rust"
set -g display-panes-time 2000

# Message and command styling
set -g message-style "bg=$rust,fg=$bg_darkest,bold"
set -g message-command-style "bg=$surface1,fg=$amber"

# Window status separator (invisible)
setw -g window-status-separator ""

#################################### STATUS BAR FORMAT ####################################

# Left side: Mode + Session name
set -g status-left "#{tmux_mode_indicator}#[bg=$surface0,fg=$pine,bold] 󰄛 #S #[bg=$bg_dark,fg=$surface0]"

# Right side: Online status + Time + Date
set -g status-right "#[fg=$surface0,bg=$bg_dark]#[fg=$subtext1,bg=$surface0]#{online_status}#[fg=$surface1,bg=$surface0]#[fg=$amber,bg=$surface1] 󰥔 %H:%M #[fg=$surface2,bg=$surface1]#[fg=$dusk,bg=$surface2]  %a %d %b #[fg=$bg_dark,bg=$surface2]"

# Window status formats
setw -g window-status-format "#[fg=$bg_dark,bg=$surface0]#[fg=$subtext1,bg=$surface0] #I  #W #[fg=$surface0,bg=$bg_dark]"
setw -g window-status-current-format "#[fg=$bg_dark,bg=$rust]#[fg=$bg_darkest,bg=$rust,bold] #I  #W #[fg=$rust,bg=$bg_dark]"

setw -g window-status-activity-style "fg=$amber,bg=$surface0,bold"
setw -g window-status-bell-style "fg=$maple,bg=$surface0,bold,blink"

# Selection colors
set -g mode-style "bg=$surface2,fg=$text"

# Clock mode
set -g clock-mode-colour "$rust"
set -g clock-mode-style 24

# Copy mode highlighting
set -g copy-mode-match-style "bg=$amber,fg=$bg_darkest"
set -g copy-mode-current-match-style "bg=$rust,fg=$bg_darkest,bold"
set -g copy-mode-mark-style "bg=$berry,fg=$bg_darkest"

#################################### ENHANCED FEATURES ####################################

# Popup styling
set -g popup-style "bg=$bg_dark,fg=$text"
set -g popup-border-style "fg=$rust"
set -g popup-border-lines "rounded"

# Menu styling
set -g menu-style "bg=$surface0,fg=$text"
set -g menu-selected-style "bg=$rust,fg=$bg_darkest"
set -g menu-border-style "fg=$rust"
