###############################################################################
# Solstice - Dark Summer Theme
# Tropical ocean at dusk: deep blue-teal darks with vivid summer accents
###############################################################################

# Base colors - deep ocean night
bg_darkest="#071219"       # Deepest ocean
bg_dark="#0d1b26"          # Dark ocean
bg="#132130"               # Base
surface0="#1e3344"         # Surface
surface1="#2a4557"         # Surface highlight
surface2="#37596c"         # Surface bright

# Text colors - warm sandy tones
text="#f2e8c9"             # Sandy white
subtext1="#d4c89c"         # Warm sand
subtext0="#a8b8b0"         # Muted sage
overlay="#6b8a94"          # Ocean overlay

# Summer accent palette
coral="#ff6b6b"            # Hot coral / watermelon
mango="#ffa94d"            # Mango orange
sunshine="#ffe066"         # Sunshine yellow
lime="#a9e34b"             # Tropical lime
seafoam="#3ecf8e"          # Seafoam green
lagoon="#26c6da"           # Lagoon turquoise
ocean="#4fc3f7"            # Open ocean blue
flamingo="#ff80ab"         # Flamingo pink
violet="#b388ff"           # Tropical violet

# Mode indicator configuration
set -g @mode_indicator_prefix_prompt " WAIT "
set -g @mode_indicator_prefix_mode_style "bg=$mango,fg=$bg_darkest,bold"
set -g @mode_indicator_copy_prompt " COPY "
set -g @mode_indicator_copy_mode_style "bg=$ocean,fg=$bg_darkest,bold"
set -g @mode_indicator_sync_prompt " SYNC "
set -g @mode_indicator_sync_mode_style "bg=$coral,fg=$bg_darkest,bold"
set -g @mode_indicator_empty_prompt " TMUX "
set -g @mode_indicator_empty_mode_style "bg=$surface0,fg=$seafoam,bold"

# Online status icons
set -g @route_to_ping "1.1.1.1"
set -g @online_icon "#[fg=$seafoam]󰖩 "
set -g @offline_icon "#[fg=$coral]󰖪 "

# Status bar
set -g status on
set -g status-justify left
set -g status-position bottom
set -g status-left-length 120
set -g status-right-length 120
set -g status-style "bg=$bg_dark,fg=$text"

# Window styles
set -g window-style "fg=$subtext0,bg=$bg_dark"
set -g window-active-style "fg=$text,bg=$bg"

# Pane borders
set -g pane-border-style "fg=$surface1"
set -g pane-active-border-style "fg=$lagoon,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format " #[fg=$flamingo,bold]#{?pane_active,󰄯 ,󰄰 }#[fg=#{?pane_active,$text,$subtext1},bold]#P: #{pane_title} "

# Pane number display
set -g display-panes-colour "$overlay"
set -g display-panes-active-colour "$lagoon"
set -g display-panes-time 2000

# Message and command styling
set -g message-style "bg=$lagoon,fg=$bg_darkest,bold"
set -g message-command-style "bg=$surface1,fg=$ocean"

# Window status separator (invisible)
setw -g window-status-separator ""

#################################### STATUS BAR FORMAT ####################################

# Left side: Mode + Session name
set -g status-left "#{tmux_mode_indicator}#[bg=$surface0,fg=$seafoam,bold] 󰄛 #S #[bg=$bg_dark,fg=$surface0]"

# Right side: Online status + Time + Date
set -g status-right "#[fg=$surface0,bg=$bg_dark]#[fg=$subtext1,bg=$surface0]#{online_status}#[fg=$surface1,bg=$surface0]#[fg=$sunshine,bg=$surface1] 󰥔 %H:%M #[fg=$surface2,bg=$surface1]#[fg=$ocean,bg=$surface2]  %a %d %b #[fg=$bg_dark,bg=$surface2]"

# Window status formats
setw -g window-status-format "#[fg=$bg_dark,bg=$surface0]#[fg=$subtext1,bg=$surface0] #I  #W #[fg=$surface0,bg=$bg_dark]"
setw -g window-status-current-format "#[fg=$bg_dark,bg=$lagoon]#[fg=$bg_darkest,bg=$lagoon,bold] #I  #W #[fg=$lagoon,bg=$bg_dark]"

setw -g window-status-activity-style "fg=$mango,bg=$surface0,bold"
setw -g window-status-bell-style "fg=$coral,bg=$surface0,bold,blink"

# Selection colors
set -g mode-style "bg=$surface2,fg=$text"

# Clock mode
set -g clock-mode-colour "$lagoon"
set -g clock-mode-style 24

# Copy mode highlighting
set -g copy-mode-match-style "bg=$sunshine,fg=$bg_darkest"
set -g copy-mode-current-match-style "bg=$mango,fg=$bg_darkest,bold"
set -g copy-mode-mark-style "bg=$flamingo,fg=$bg_darkest"

#################################### ENHANCED FEATURES ####################################

# Popup styling
set -g popup-style "bg=$bg_dark,fg=$text"
set -g popup-border-style "fg=$lagoon"
set -g popup-border-lines "rounded"

# Menu styling
set -g menu-style "bg=$surface0,fg=$text"
set -g menu-selected-style "bg=$lagoon,fg=$bg_darkest"
set -g menu-border-style "fg=$lagoon"
