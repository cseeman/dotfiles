###############################################################################
# Equinox Dawn - Light Autumn Theme
# Morning light through turning leaves: warm parchment with deep foliage accents
###############################################################################

# Base colors - warm parchment and oat
bg_light="#fdf5e9"         # Brightest parchment (near white)
bg="#f9efe0"               # Base parchment
bg_mid="#f3e6d3"           # Parchment shadow
surface0="#ecdec7"         # Oat
surface1="#e3d2b7"         # Deeper oat
surface2="#d7c3a3"         # Darkest oat

# Text colors - deep bark for contrast on light backgrounds
text="#382718"             # Deep bark
subtext1="#4a3625"         # Bark
subtext0="#5d4732"         # Medium bark
overlay="#6e5a44"          # Muted overlay

# Autumn accent palette - deepened for light-background contrast
# (all work as highlight backgrounds with parchment text on top)
maple="#a82a1e"            # Red maple
rust="#94430c"             # Burnt orange (primary)
amber="#6b5102"            # Amber gold
wheat="#5f5226"            # Dried wheat
moss="#455e0e"             # Moss and olive
pine="#125e46"             # Evergreen
dusk="#1a5580"             # October sky
berry="#8f2450"            # Cranberry
plum="#5b3390"             # Aster plum

# Mode indicator configuration
set -g @mode_indicator_prefix_prompt " WAIT "
set -g @mode_indicator_prefix_mode_style "bg=$rust,fg=$bg_light,bold"
set -g @mode_indicator_copy_prompt " COPY "
set -g @mode_indicator_copy_mode_style "bg=$dusk,fg=$bg_light,bold"
set -g @mode_indicator_sync_prompt " SYNC "
set -g @mode_indicator_sync_mode_style "bg=$maple,fg=$bg_light,bold"
set -g @mode_indicator_empty_prompt " TMUX "
set -g @mode_indicator_empty_mode_style "bg=$surface0,fg=$plum,bold"

# Online status icons
set -g @route_to_ping "1.1.1.1"
set -g @online_icon "#[fg=$pine]󰖩 "
set -g @offline_icon "#[fg=$maple]󰖪 "

# Status bar
set -g status on
set -g status-justify left
set -g status-position bottom
set -g status-left-length 120
set -g status-right-length 120
set -g status-style "bg=$bg_mid,fg=$text"

# Window styles - active pane is lightest, inactive panes visibly dimmed
set -g window-style "fg=$overlay,bg=$surface0"
set -g window-active-style "fg=$text,bg=$bg_light"

# Pane borders
set -g pane-border-style "fg=$surface2"
set -g pane-active-border-style "fg=$rust,bold"
set -g pane-border-lines heavy
set -g pane-border-indicators both
set -g pane-border-status top
set -g pane-border-format " #[fg=$berry,bold]#{?pane_active,󰄯 ,󰄰 }#[fg=#{?pane_active,$text,$subtext1},bold]#P: #{pane_title} "

# Pane number display
set -g display-panes-colour "$overlay"
set -g display-panes-active-colour "$rust"
set -g display-panes-time 2000

# Message and command styling
set -g message-style "bg=$rust,fg=$bg_light,bold"
set -g message-command-style "bg=$surface1,fg=$amber"

# Window status separator (invisible)
setw -g window-status-separator ""

#################################### STATUS BAR FORMAT ####################################

# Left side: Mode + Session name
set -g status-left "#{tmux_mode_indicator}#[bg=$surface0,fg=$pine,bold] 󰄛 #S #[bg=$bg_mid,fg=$surface0]"

# Right side: Online status + Time + Date
set -g status-right "#[fg=$surface0,bg=$bg_mid]#[fg=$subtext1,bg=$surface0]#{online_status}#[fg=$surface1,bg=$surface0]#[fg=$amber,bg=$surface1] 󰥔 %H:%M #[fg=$surface2,bg=$surface1]#[fg=$dusk,bg=$surface2]  %a %d %b #[fg=$bg_mid,bg=$surface2]"

# Window status formats
setw -g window-status-format "#[fg=$bg_mid,bg=$surface0]#[fg=$subtext1,bg=$surface0] #I  #W #[fg=$surface0,bg=$bg_mid]"
setw -g window-status-current-format "#[fg=$bg_mid,bg=$rust]#[fg=$bg_light,bg=$rust,bold] #I  #W #[fg=$rust,bg=$bg_mid]"

# Activity and bell notifications
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "fg=$amber,bg=$surface0,bold"
setw -g window-status-bell-style "fg=$maple,bg=$surface0,bold,blink"

# Selection colors
set -g mode-style "bg=$surface1,fg=$text"

# Clock mode
set -g clock-mode-colour "$rust"
set -g clock-mode-style 24

# Copy mode highlighting
set -g copy-mode-match-style "bg=$amber,fg=$bg_light"
set -g copy-mode-current-match-style "bg=$rust,fg=$bg_light,bold"
set -g copy-mode-mark-style "bg=$berry,fg=$bg_light"

#################################### ENHANCED FEATURES ####################################

# Popup styling
set -g popup-style "bg=$bg,fg=$text"
set -g popup-border-style "fg=$rust"
set -g popup-border-lines "rounded"

# Menu styling
set -g menu-style "bg=$surface0,fg=$text"
set -g menu-selected-style "bg=$rust,fg=$bg_light"
set -g menu-border-style "fg=$rust"
